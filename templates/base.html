{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}For {{ c.BOY }} ❤️{% endblock %}</title>
<meta name="theme-color" content="#2a0f45">
<link rel="manifest" href="{% static 'manifest.json' %}">
<link rel="icon" href="{% static 'icons/icon-192.png' %}">
<link rel="apple-touch-icon" href="{% static 'icons/icon-192.png' %}">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="{% block bodyclass %}{% endblock %}">
<div id="sky" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
{% block content %}{% endblock %}
<script src="{% static 'vendor/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'js/app.js' %}"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(function(){});}</script>
</body>
</html>
